name: Cleanup worktree tests

on:
  push:
    branches: [main]
    paths:
      - "manual/git/cleanup_worktree/**"
      - ".github/workflows/cleanup-worktree-tests.yml"
  pull_request:
    paths:
      - "manual/git/cleanup_worktree/**"
      - ".github/workflows/cleanup-worktree-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test cleanup_worktree
        run: |
          python -m unittest discover \
            -s manual/git/cleanup_worktree/tests \
            -p 'test_*.py' -v
